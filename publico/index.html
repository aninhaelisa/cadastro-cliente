<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="src/icon.png" type="image/x-icon">
</head>

<body>

    <header>
        <div class="hc1">
            <a href="index.html"><img src="src/icon.png" alt="imagem Logo cadastro rosa" class="logo"></a>
            <h1>Cadastro Clientes</h1>
        </div>

        <nav class="menu">
            <button class="hamburguer" id="botao" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="lista" id="lista">
                <li><a href="pages/lista.html">Lista Clientes</a></li>
                <li><a href="#">Suporte</a></li>
                <li><a href="#">Relatórios</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="s1">

            <form action="/dados" method="POST">
                <fieldset>
                    <legend>Dados de Contato:</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="NOME COMPLETO" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo123@email.com" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="tel" name="tel" placeholder="(00) 0000-0000" maxlength="15"
                        pattern="\(\d{2}\) (\d{5}-\d{4}|\d{4}-\d{4})" required>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="15"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
                </fieldset>
                <fieldset>
                    <legend>Dados de Endereço</legend>

                    <div>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    </div>

                    <div>
                        <label for="rua">Logradouro (Rua/Avenida):</label>
                        <input type="text" id="rua" name="rua" required>
                    </div>

                    <div>
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" name="numero" required>
                    </div>

                    <div>
                        <label for="complemento">Complemento (opcional):</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc.">
                    </div>

                    <div>
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>

                    <div>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>

                    <div>
                        <label for="estado">Estado (UF):</label>
                        <input type="text" id="estado" name="estado" maxlength="2" placeholder="PR" required>
                    </div>
                </fieldset>

                <div class="c-btn">
                    <button type="submit">Enviar dados</button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <h2>Cadastro de Clientes</h2>
        <p>Organize seus clientes de forma simples e prática.</p>

        <p class="copyright">
            &copy; 2026 Cadastro de Clientes.
            Todos os direitos reservados.
        </p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
