<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="src/icon.png" type="image/x-icon">
</head>

<body>

    <header>
        <div class="hc1">
            <a href="index.html"><img src="src/icon.png" alt="imagem Logo cadastro rosa" class="logo"></a>
            <h1>Cadastro Clientes</h1>
        </div>

        <nav class="menu">
            <button class="hamburguer" id="botao" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        
            <ul class="lista" id="lista">
                <li><a href="#">Lista Clientes</a></li>
                <li><a href="#">Suporte</a></li>
                <li><a href="#">Relatórios</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="s1">

            <form action="/dados" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="NOME COMPLETO" required>
              
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo123@email.com" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="tel" name="tel" placeholder="(00) 0000-0000" maxlength="15"  pattern="\(\d{2}\) (\d{5}-\d{4}|\d{4}-\d{4})" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="15" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
              
                <button type="submit">Enviar</button>
            </form>

        </section>

    </main>
    

    <script src="script.js"></script>
</body>

</html>
